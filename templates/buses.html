{% extends "./base.html" %}
{% block title %}Buses{% endblock %}

{% block body %}

<div class="text-center mb-4">
    <h1 class="animate__animated animate__pulse animate__infinite"
        style="font-family: 'Comic Sans MS', sans-serif;">
        BUSES
    </h1>
</div>
<div class="card shadow">
<div class="card shadow">
    <div class="card-header bg-dark text-white">
        <h4 class="mb-0">Listado de Tarjetas</h4>
    </div>

<a href="{% url 'busesCreate' %}" class="btn btn-success mb-3">
    Nuevo Bus
</a>

<table class="table table-striped text-center">
    <thead class="thead-dark">
        <tr>
            <th>#</th>
            <th>Placa</th>
            <th>Cooperativa</th>
            <th>Numero</th>
            <th>Opciones</th>
        </tr>
    </thead>

    <tbody>
        {% for b in buses %}
        <tr>
            <td>{{ forloop.counter }}</td>
            <td>{{ b.placa }}</td>
            <td>{{ b.cooperativa }}</td>
            <td>{{ b.numero }}</td>
            <td>
                <a href="{% url 'busesEdit' b.id %}" class="btn btn-info btn-sm">Editar</a>
                <a href="{% url 'busesDelete' b.id %}" class="btn btn-danger btn-sm">Eliminar</a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
</div>
{% endblock %}
