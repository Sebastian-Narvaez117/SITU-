<!DOCTYPE html>
<html lang="es">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}SISTEMA SITU{% endblock %}</title>

    <!-- Bootstrap -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css">

    <!-- Animaciones -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />

    <!-- CSS propio -->
    <link rel="stylesheet" href="{% static 'login.css' %}">
</head>


<body class="d-flex flex-column min-vh-100"
      style="background: linear-gradient(90deg, #2ecc71, #6c5ce7);">

    <!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <a class="navbar-brand font-weight-bold" href="{% url 'home' %}">
        SITU LOJA
    </a>

    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNav">

        <ul class="navbar-nav mr-auto">
            <li class="nav-item">
                <a class="nav-link" href="{% url 'pasajeros' %}">Pasajeros</a>
            </li>

            <li class="nav-item">
                <a class="nav-link" href="{% url 'tarjetas' %}">Tarjetas</a>
            </li>

            <li class="nav-item">
                <a class="nav-link" href="{% url 'buses' %}">Buses</a>
            </li>

            <li class="nav-item">
                <a class="nav-link" href="{% url 'viajes' %}">Viajes</a>
            </li>

            <li class="nav-item">
                <a class="nav-link" href="{% url 'pagos' %}">Pagos</a>
            </li>
        </ul>

        <span class="navbar-text text-white">
            Sistema de Transporte
        </span>

    </div>
</nav>

    <!-- CONTENIDO -->
    <main class="container py-4 flex-fill">
        {% block body %}
        {% endblock %}
    </main>

    <!-- FOOTER -->
    <footer class="bg-dark text-white text-center py-3 mt-auto">
        <small>© 2026 Sistema de Transporte Urbano SITU Loja</small>
    </footer>

    <!-- SCRIPTS -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/js/bootstrap.min.js"></script>

</body>
</html>
